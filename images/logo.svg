<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="merosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Top Left Arch -->
    <path d="M 64 82 L 64 45 C 64 25, 96 25, 96 45 L 96 82" stroke="url(#merosGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top Right Arch -->
    <path d="M 104 82 L 104 45 C 104 25, 136 25, 136 45 L 136 82" stroke="url(#merosGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Left Arch -->
    <path d="M 64 118 L 64 155 C 64 175, 96 175, 96 155 L 96 118" stroke="url(#merosGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Right Arch -->
    <path d="M 104 118 L 104 155 C 104 175, 136 175, 136 155 L 136 118" stroke="url(#merosGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upper Horizontal Bar with Left Extension & Dot -->
    <line x1="42" y1="88" x2="148" y2="88" stroke="url(#merosGrad)" stroke-width="7" stroke-linecap="round" />
    <circle cx="42" cy="88" r="4.5" fill="#0d9488" />

    <!-- Lower Horizontal Bar with Left Extension & Center Node -->
    <line x1="42" y1="112" x2="148" y2="112" stroke="url(#merosGrad)" stroke-width="7" stroke-linecap="round" />
    <circle cx="42" cy="112" r="4.5" fill="#0d9488" />

    <!-- Center Bridge Line & Center Pulse Dot -->
    <line x1="100" y1="88" x2="100" y2="112" stroke="url(#merosGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="100" cy="100" r="5" fill="#10b981" />
  </g>
</svg>
